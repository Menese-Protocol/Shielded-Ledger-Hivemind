[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-ff = { workspace = true }
ark-bn254 = { workspace = true }
ark-bls12-381 = { workspace = true, optional = true }
ark-relations = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-crypto-primitives = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }

[dev-dependencies]
ark-groth16 = { workspace = true }
ark-snark = { workspace = true }

[features]
# The five constraint-system test files carry a crate-level
# `#![cfg(feature = "bls12-381")]`. Without this default they compile to nothing
# and `cargo test` reports `ok. 0 passed` for each — a green suite running no
# tests at all.
default = ["bls12-381"]
bls12-381 = ["dep:ark-bls12-381"]
